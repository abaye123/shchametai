<div
  class="h-dvh min-h-dvh flex flex-col overflow-hidden text-sand-900"
  [dir]="i18n.dir()">

  <!-- Header -->
  <header class="flex-none px-3 pt-3 sm:px-4 sm:pt-4">
    <div class="mx-auto w-full max-w-[1600px] rounded-3xl border border-black/10
                px-3 py-2 sm:px-5 sm:py-3 flex items-center justify-between gap-3
                bg-sand-800 text-sand-50">

      <div class="flex items-center gap-3 min-w-0">
        <div class="grid place-items-center w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-white/15
                    border border-white/25 shadow-inner-soft flex-none overflow-hidden">
          <img src="src/assets/logo.png" alt="" class="w-7 h-7 sm:w-8 sm:h-8 object-contain">
        </div>
        <div class="min-w-0">
          <h1 class="text-lg sm:text-xl font-bold tracking-wide truncate leading-tight">
            {{ i18n.t().title }}
          </h1>
          <p class="hidden sm:block text-[11px] text-sand-300 leading-tight">
            {{ i18n.currentLang() === 'he' ? 'שחמט חכם, גם בלי אינטרנט' : 'Smart chess, even offline' }}
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-none">
        <!-- Sound Toggle -->
        <button
          (click)="sound.toggleMute()"
          class="btn-glass !rounded-2xl !p-2.5"
          [title]="i18n.t().sound">
          @if (!sound.isMuted()) {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6 4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" />
            </svg>
          }
        </button>

        <button
          (click)="i18n.toggleLanguage()"
          class="btn-glass !rounded-2xl">
          {{ i18n.t().language }}
        </button>
      </div>
    </div>
  </header>

  <!-- Screen area: takes every remaining pixel of the viewport height -->
  <div class="flex-1 min-h-0 relative">

    <!-- Welcome Screen -->
    @if (currentScreen() === 'welcome') {
      <app-welcome-screen
        class="block h-full"
        (startNewGame)="startNewGame($event)"
        (goToHistory)="goToHistory()">
      </app-welcome-screen>
    }

    <!-- Settings Screen -->
    @if (currentScreen() === 'settings') {
      <app-settings-screen
        class="block h-full"
        [gameMode]="gameMode()"
        [level]="level()"
        [apiKey]="apiKey()"
        (applySettings)="applySettings($event)"
        (startNewGame)="startNewGame($event)"
        (updateApiKey)="updateApiKey($event)"
        (back)="goToWelcome()">
      </app-settings-screen>
    }

    <!-- Game Screen -->
    @if (currentScreen() === 'game') {
      <app-game-screen
        class="block h-full"
        [gameMode]="gameMode()"
        [level]="level()"
        [apiKey]="apiKey()"
        [playerColor]="playerColor()"
        (backToMenu)="goToWelcome()"
        (goToSettings)="goToSettings()">
      </app-game-screen>
    }

    <!-- History Screen -->
    @if (currentScreen() === 'history') {
      <app-history-screen
        class="block h-full"
        (loadGame)="loadGame($event)"
        (deleteGame)="deleteGame($event)"
        (clearAllGames)="clearAllGames()"
        (exportGames)="exportGames()"
        (exportSingleGame)="exportSingleGame($event)"
        (importGames)="importGames($event)"
        (toggleFavorite)="toggleFavorite($event)"
        (back)="goToWelcome()">
      </app-history-screen>
    }
  </div>
</div>
